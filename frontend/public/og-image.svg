<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1524"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="glowTR" cx="100%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="0%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.055"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowTR)"/>
  <rect width="1200" height="630" fill="url(#glowBL)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#ea580c"/>

  <!-- ─── Icon 148×148: box (526,82)→(674,230) ─── -->
  <rect x="526" y="82" width="148" height="148" rx="32" fill="url(#iconGrad)"/>
  <!-- envelope body -->
  <rect x="544" y="161" width="111" height="51" rx="10" fill="#fff"/>
  <!-- envelope V fold -->
  <path d="M549 163 L600 193 L651 163"
        fill="none" stroke="#ea580c" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bird body -->
  <ellipse cx="598" cy="142" rx="25" ry="21" fill="#fff"/>
  <!-- bird tail -->
  <path d="M621 135 L642 142 L621 149 Z" fill="#fff"/>

  <!-- ─── Title ─── -->
  <text x="600" y="318"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="82" font-weight="700" fill="#ffffff" letter-spacing="-2">MailRoost</text>

  <!-- ─── Tagline ─── -->
  <text x="600" y="362"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="27" font-weight="500" fill="#f97316" letter-spacing="1">수많은 메일의 보금자리</text>

  <!-- ─── Subtitle ─── -->
  <text x="600" y="405"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="23" fill="#64748b" letter-spacing="0.3">여러 이메일 계정을 한곳에서 관리하세요</text>

  <!-- ─── Separator ─── -->
  <line x1="480" y1="438" x2="720" y2="438" stroke="#1e2d42" stroke-width="1.5"/>

  <!-- ─── Provider badges: 4×136 + 3×16 = 592px, starts at x=304 ─── -->
  <rect x="304" y="458" width="136" height="44" rx="22"
        fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <text x="372" y="487" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" fill="#cbd5e1">Gmail</text>

  <rect x="456" y="458" width="136" height="44" rx="22"
        fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <text x="524" y="487" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" fill="#cbd5e1">네이버</text>

  <rect x="608" y="458" width="136" height="44" rx="22"
        fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <text x="676" y="487" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" fill="#cbd5e1">다음</text>

  <rect x="760" y="458" width="136" height="44" rx="22"
        fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <text x="828" y="487" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" fill="#cbd5e1">IMAP</text>

  <!-- ─── Bottom domain ─── -->
  <text x="600" y="568"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="17" fill="#3b526e" letter-spacing="0.8">mailroost.ionjk2879.workers.dev</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="#ea580c" opacity="0.45"/>
</svg>
